packages:
  - docs
  - examples/*
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  keytar: true # OS keychain for `mint login`, which turns on search in the local docs preview
  sharp: true
  unrs-resolver: true
  # Also pulled in by the mint CLI, but not needed for dev, validate, or deploy.
  '@scarf/scarf': false # install-time telemetry ping
  puppeteer: false # downloads Chrome; only `mint a11y` uses it
